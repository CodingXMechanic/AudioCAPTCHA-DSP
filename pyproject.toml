[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiocaptcha-dsp"
version = "0.1.0"
description = "Exploiting AI Blindspots via Psychoacoustic Multirate Distortions"
requires-python = ">=3.10"
license = {text = "Research Use Only"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "pywavelets>=1.4",
    "openai-whisper>=20231117",
    "vosk>=0.3.45",
    "jiwer>=3.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
audiocaptcha = "audiocaptcha_dsp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
